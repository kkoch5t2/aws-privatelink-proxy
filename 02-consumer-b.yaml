AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  PrivateLink consumer lab. Creates a two-AZ no-internet VPC, an interface
  endpoint and a Lambda to test Squid egress through the provider service.
Parameters:
  ServiceName:
    Type: String
    AllowedPattern: '^com\.amazonaws\.vpce\.[a-z0-9-]+\.vpce-svc-[0-9a-f]+$'
    Description: ServiceName output of provider stack in account A.
  ProviderAzId1:
    Type: String
    Default: apse2-az1
    Description: MUST match the ProviderAzId1 output of A (AZ names differ across AWS accounts).
  ProviderAzId2:
    Type: String
    Default: apse2-az2
    Description: MUST match ProviderAzId2 output from provider (same physical AZ across accounts).
Resources:
  ConsumerVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.241.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: privatelink-proxy-lab-consumer
        - Key: Lab
          Value: PrivateLinkProxyLab
  PrivateSubnetAz1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ConsumerVpc
      CidrBlock: 10.241.1.0/24
      AvailabilityZoneId: !Ref ProviderAzId1
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: privatelink-proxy-lab-consumer-private-az1
  PrivateSubnetAz2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ConsumerVpc
      CidrBlock: 10.241.2.0/24
      AvailabilityZoneId: !Ref ProviderAzId2
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: privatelink-proxy-lab-consumer-private-az2
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref ConsumerVpc
      GroupDescription: PrivateLink lab Lambda client; no inbound rules
      Tags:
        - Key: Name
          Value: privatelink-proxy-lab-consumer-lambda-sg
  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref ConsumerVpc
      GroupDescription: Allow proxy port 3128 from lab Lambda only
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3128
          ToPort: 3128
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: Allow TCP 3128 only from Lambda security group
      Tags:
        - Key: Name
          Value: privatelink-proxy-lab-consumer-vpce-sg
  ConsumerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Ref ServiceName
      VpcId: !Ref ConsumerVpc
      SubnetIds:
        - !Ref PrivateSubnetAz1
        - !Ref PrivateSubnetAz2
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup
      PrivateDnsEnabled: false
      Tags:
        - Key: Name
          Value: privatelink-proxy-lab-consumer-vpce
        - Key: Lab
          Value: PrivateLinkProxyLab
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      RoleName: !Sub '${AWS::StackName}-lambda-role'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
  ProxyClientLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-test'
      RetentionInDays: 3
  ProxyClientFunction:
    Type: AWS::Lambda::Function
    DependsOn: ProxyClientLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-test'
      Description: Call this manually to verify egress through A's Squid via PrivateLink.
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 25
      MemorySize: 128
      Tags:
        - Key: Lab
          Value: PrivateLinkProxyLab
      VpcConfig:
        SubnetIds:
          - !Ref PrivateSubnetAz1
          - !Ref PrivateSubnetAz2
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
      Environment:
        Variables:
          PROXY_HOST: !Select
            - 1
            - !Split
              - ':'
              - !Select [0, !GetAtt ConsumerEndpoint.DnsEntries]
          PROXY_PORT: '3128'
      Code:
        ZipFile: |
          import os
          import urllib.request
          import urllib.error

          def handler(event, context):
              # The provider Squid allowlist only permits CONNECT to checkip.amazonaws.com.
              url = 'https://checkip.amazonaws.com/'
              proxy = 'http://{}:{}'.format(os.environ['PROXY_HOST'], os.environ['PROXY_PORT'])
              opener = urllib.request.build_opener(
                  urllib.request.ProxyHandler({'http': proxy, 'https': proxy})
              )
              req = urllib.request.Request(url, headers={'User-Agent': 'aws-privatelink-proxy-lab/1.0'})
              try:
                  with opener.open(req, timeout=12) as response:
                      return {
                          'success': True,
                          'http_status': response.status,
                          'external_egress_ip': response.read(256).decode('utf-8').strip(),
                          'destination': url,
                          'proxy_hostname': os.environ['PROXY_HOST']
                      }
              except Exception as exc:
                  return {
                      'success': False,
                      'error_type': type(exc).__name__,
                      'error': str(exc),
                      'proxy_hostname': os.environ['PROXY_HOST']
                  }
Outputs:
  ConsumerEndpointId:
    Value: !Ref ConsumerEndpoint
  ConsumerEndpointRegionalHostname:
    Description: Private hostname of regional interface VPC endpoint used by Lambda.
    Value: !Select
      - 1
      - !Split
        - ':'
        - !Select [0, !GetAtt ConsumerEndpoint.DnsEntries]
  TestLambdaName:
    Value: !Ref ProxyClientFunction
  ConsumerVpcId:
    Value: !Ref ConsumerVpc
  SubnetIdAz1:
    Value: !Ref PrivateSubnetAz1
  ConsumerAzId1:
    Value: !GetAtt PrivateSubnetAz1.AvailabilityZoneId
  SubnetIdAz2:
    Value: !Ref PrivateSubnetAz2
  ConsumerAzId2:
    Value: !GetAtt PrivateSubnetAz2.AvailabilityZoneId
